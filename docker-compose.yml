# paper-mcp — service + Marker.
#
# Marker is a REQUIRED component, not an opt-in profile (SRS v0.2). PDF
# extraction is the product: PaperHub shipped crude PyMuPDF extraction once,
# measured the output as "conference-UNusable", and replaced it with Marker.
# A host without a GPU cannot serve this at all: extraction is the product,
# so a PDF reports `extraction_unavailable` rather than degrading silently.
services:
  paper-mcp:
    build: .
    image: paper-mcp
    ports: ["8000:8000"]
    environment:
      - PAPER_MCP_HOST=0.0.0.0
      - PAPER_MCP_PORT=8000
      - PAPER_MCP_MARKER_URL=http://marker:8002
      # Per-request page batching bounds VRAM. VRAM scales with page CONTENT
      # DENSITY, not page count: PaperHub measured a single dense two-column
      # page producing 200+ Surya OCR lines and saturating 6 GB, and a 5-page
      # batch taking 21 minutes. Raise only on a bigger GPU.
      - PAPER_MCP_MARKER_MAX_PAGES=1
      - PAPER_MCP_ARTIFACT_ROOT=/app/artifacts
      # Ceiling on an uploaded PDF. Part of containment (SRS NFR-02), not
      # politeness. 25 MB looked generous against arXiv preprints and was
      # wrong for published papers: over a real 44-paper library the median
      # is 10.6 MB and the largest 67 MB, so a quarter was refused outright.
      # This bounds memory per in-flight extraction (~2.5x the file while
      # queued), which the per-caller quota is what really limits.
      - PAPER_MCP_MAX_UPLOAD_BYTES=${PAPER_MCP_MAX_UPLOAD_BYTES:-104857600}
      # A public deployment MUST name its own hostname here, or every request
      # is rejected with 421 by DNS-rebinding protection.
      - PAPER_MCP_ALLOWED_HOSTS=${PAPER_MCP_ALLOWED_HOSTS:-localhost:8000,127.0.0.1:8000}
      - PAPER_MCP_LOG_LEVEL=${PAPER_MCP_LOG_LEVEL:-warning}
    volumes:
      - paper-mcp-artifacts:/app/artifacts
    # No `seccomp=unconfined` here any more. It existed because nsjail creates
    # namespaces, which Docker's default profile blocks — and nsjail existed
    # because this service compiled caller-supplied LaTeX. With compilation
    # out of scope (SRS v1.0) nothing here executes untrusted input, so the
    # default seccomp profile applies again.
    depends_on:
      - marker
    restart: unless-stopped

  # ── Marker extraction ─────────────────────────────────────────────────────
  # Ported from PaperHub's marker_service @ fd65834.
  marker:
    build: ./marker_service
    image: paper-mcp-marker
    # Loopback only — NOT 0.0.0.0. Marker hands whatever bytes it is given to
    # pillow, and `marker-pdf` pins `pillow<11` at every released version
    # (2.0.0 included) while the current decode advisories are fixed in
    # 12.3.0. Those CVEs therefore cannot be patched here, so the control that
    # remains is who gets to feed the decoder.
    #
    # A bare `8002:8002` binds every interface — and on Linux publishes
    # straight through the host firewall — letting anyone who can route to the
    # host POST an arbitrary PDF into the decoder, bypassing paper-mcp's auth
    # and its quota entirely. On loopback the only route in is `extract_pdf`,
    # behind a bearer token and an extraction budget. paper-mcp reaches Marker
    # over the compose network (`http://marker:8002`) regardless; the
    # published port exists for the from-source dev flow.
    ports: ["127.0.0.1:8002:8002"]
    environment:
      # Marker's use_llm accuracy pass materially improves tables, math and
      # layout. It is an internal quality knob on a deterministic pipeline —
      # never exposed as a tool — and the service runs keyless without it
      # (SRS §I-7).
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Which model that accuracy pass calls. marker-pdf carries its own
      # default and Google has already retired it once — every call 404'd,
      # Marker logged a warning, returned 200, and the pass silently stopped
      # running. Empty falls back to the pinned default in llm_config.py.
      - MARKER_GEMINI_MODEL=${MARKER_GEMINI_MODEL:-}
      - MARKER_MAX_PAGES=1
    volumes:
      # ~2 GB of Surya weights download once and persist across image
      # rebuilds; without this every rebuild re-downloads them.
      - marker-models:/models
    # ── containment (SRS NFR-02) ─────────────────────────────────────────
    # Marker is the sandbox boundary, in the way nsjail was for LaTeX. It is
    # the only component that touches untrusted input: `marker-pdf` pins
    # `pillow<11` at every released version while current image-decode
    # advisories are fixed in 12.3.0, and upgrading is not available — so the
    # control is not whether an exploit triggers, but what it reaches.
    #
    # Pre-validation cannot substitute. The advisories are decode bugs
    # reachable through images that are otherwise perfectly legitimate, and
    # decoding documents is what this service is for.
    #
    # Egress is deliberately NOT cut here, and that is a trade-off rather than
    # an oversight. Cutting it (a `networks: [internal]` with
    # `internal: true`) is the strongest control available in compose — but it
    # also disables Marker's `use_llm` accuracy pass, which calls Google's
    # API and is what keeps table structure honest. Compose cannot allowlist a
    # single host; that needs a proxy or host firewall.
    #
    # So: keyless deployments SHOULD cut egress once the weights are cached
    # (they download on first extraction). Deployments using GEMINI_API_KEY
    # keep egress and rely on the controls below. Choose deliberately.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # Marker writes scratch files per extraction; a read-only root needs
      # somewhere for them, sized so a decompression bomb fills a tmpfs
      # rather than the host disk.
      - /tmp:size=2g
    mem_limit: 8g
    pids_limit: 512
    restart: unless-stopped
    # GPU passthrough. Requires the NVIDIA container toolkit on the host;
    # Marker falls back to CPU automatically if unavailable, which is far too
    # slow to be useful but does not crash.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  paper-mcp-artifacts:
  marker-models:
