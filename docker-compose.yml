# paper-mcp — service + Marker.
#
# Marker is a REQUIRED component, not an opt-in profile (SRS v0.2). PDF
# extraction is the product: PaperHub shipped crude PyMuPDF extraction once,
# measured the output as "conference-UNusable", and replaced it with Marker.
# A host without a GPU cannot serve this at all: extraction is the product,
# so a PDF reports `extraction_unavailable` rather than degrading silently.
services:
  paper-mcp:
    build: .
    image: paper-mcp
    ports: ["8000:8000"]
    environment:
      - PAPER_MCP_HOST=0.0.0.0
      - PAPER_MCP_PORT=8000
      - PAPER_MCP_MARKER_URL=http://marker:8002
      # Per-request page batching bounds VRAM. VRAM scales with page CONTENT
      # DENSITY, not page count: PaperHub measured a single dense two-column
      # page producing 200+ Surya OCR lines and saturating 6 GB, and a 5-page
      # batch taking 21 minutes. Raise only on a bigger GPU.
      - PAPER_MCP_MARKER_MAX_PAGES=${PAPER_MCP_MARKER_MAX_PAGES:-1}
      - PAPER_MCP_ARTIFACT_ROOT=/app/artifacts
      # Extractions running at once. 1 because a second concurrent dense page
      # OOMs a 6 GB card — a statement about the hardware, not the service.
      # On a bigger card raise it: on a shared endpoint this is also the
      # fairness ceiling, since one caller's queue stalls everyone else.
      - PAPER_MCP_JOB_CONCURRENCY=${PAPER_MCP_JOB_CONCURRENCY:-1}
      # Ceiling on an uploaded PDF. Part of containment (SRS NFR-02), not
      # politeness. 25 MB looked generous against arXiv preprints and was
      # wrong for published papers: over a real 44-paper library the median
      # is 10.6 MB and the largest 67 MB, so a quarter was refused outright.
      # This bounds memory per in-flight extraction (~2.5x the file while
      # queued), which the per-caller quota is what really limits.
      - PAPER_MCP_MAX_UPLOAD_BYTES=${PAPER_MCP_MAX_UPLOAD_BYTES:-104857600}
      # A public deployment MUST name its own hostname here, or every request
      # is rejected with 421 by DNS-rebinding protection.
      - PAPER_MCP_ALLOWED_HOSTS=${PAPER_MCP_ALLOWED_HOSTS:-localhost:8000,127.0.0.1:8000}
      # Whether X-Forwarded-For names the client. Off by default, and this
      # compose file is why: it publishes 8000 directly, so with no proxy
      # in front the header comes from the caller. In open mode the per-IP
      # meter is the only brake, and a rotating header defeated it outright
      # — measured at 60/60 requests accepted against a 5-per-minute limit.
      # Turn it on when you have actually put a proxy in front.
      - PAPER_MCP_TRUST_FORWARDED_FOR=${PAPER_MCP_TRUST_FORWARDED_FOR:-0}
      - PAPER_MCP_LOG_LEVEL=${PAPER_MCP_LOG_LEVEL:-warning}
      # Authentication. `open` means every caller is unauthenticated, which is
      # fine on a laptop and never on a public endpoint. These were absent
      # from this file entirely, so following the README's own deployment
      # warning left you on AUTH_MODE=open with no way to say otherwise.
      # Set the mode and both OIDC variables together; the service logs an
      # error at boot if the mode is set without an issuer and audience.
      - PAPER_MCP_AUTH_MODE=${PAPER_MCP_AUTH_MODE:-open}
      - PAPER_MCP_OIDC_ISSUER=${PAPER_MCP_OIDC_ISSUER:-}
      - PAPER_MCP_OIDC_AUDIENCE=${PAPER_MCP_OIDC_AUDIENCE:-}
      # Stable key for per-caller metering. Unset means a per-process
      # ephemeral salt, so every caller's quota resets whenever the process
      # does — which on a crash-looping container is no quota at all.
      - PAPER_MCP_SUBJECT_SALT=${PAPER_MCP_SUBJECT_SALT:-}
      # Figure URLs are built from this. Left at the default, every image_url
      # a caller receives points at localhost:8000 regardless of where the
      # service actually answers.
      - PAPER_MCP_PUBLIC_BASE_URL=${PAPER_MCP_PUBLIC_BASE_URL:-http://localhost:8000}
      - PAPER_MCP_ALLOWED_ORIGINS=${PAPER_MCP_ALLOWED_ORIGINS:-}
      - PAPER_MCP_QUOTA_CALLS_PER_MINUTE=${PAPER_MCP_QUOTA_CALLS_PER_MINUTE:-60}
      - PAPER_MCP_QUOTA_EXTRACTIONS_PER_HOUR=${PAPER_MCP_QUOTA_EXTRACTIONS_PER_HOUR:-20}
      - PAPER_MCP_ARTIFACT_TTL_HOURS=${PAPER_MCP_ARTIFACT_TTL_HOURS:-24}
      # Queue depth past which new work is refused rather than accepted into
      # an unbounded backlog. Extraction is serialized, so at ~45 s a paper
      # the default is roughly 24 minutes of queue.
      - PAPER_MCP_MAX_QUEUED_JOBS=${PAPER_MCP_MAX_QUEUED_JOBS:-32}
      # On its own volume. Derived from the artifact root this landed on
      # /app/spool — the container's writable layer — so a backlog of 100 MB
      # uploads filled the Docker root disk rather than the volume sized for
      # this data.
      - PAPER_MCP_SPOOL_DIR=/app/spool
    volumes:
      - paper-mcp-artifacts:/app/artifacts
      - paper-mcp-spool:/app/spool
    # No `seccomp=unconfined` here any more. It existed because nsjail creates
    # namespaces, which Docker's default profile blocks — and nsjail existed
    # because this service compiled caller-supplied LaTeX. With compilation
    # out of scope (SRS v1.0) nothing here executes untrusted input, so the
    # default seccomp profile applies again.
    depends_on:
      - marker
    restart: unless-stopped

  # ── Marker extraction ─────────────────────────────────────────────────────
  # Ported from PaperHub's marker_service @ fd65834.
  marker:
    build: ./marker_service
    image: paper-mcp-marker
    # Loopback only — NOT 0.0.0.0. Marker hands whatever bytes it is given to
    # pillow, and `marker-pdf` pins `pillow<11` at every released version
    # (2.0.0 included) while the current decode advisories are fixed in
    # 12.3.0. Those CVEs therefore cannot be patched here, so the control that
    # remains is who gets to feed the decoder.
    #
    # A bare `8002:8002` binds every interface — and on Linux publishes
    # straight through the host firewall — letting anyone who can route to the
    # host POST an arbitrary PDF into the decoder, bypassing paper-mcp's auth
    # and its quota entirely. On loopback the only route in is `extract_pdf`,
    # behind a bearer token and an extraction budget. paper-mcp reaches Marker
    # over the compose network (`http://marker:8002`) regardless; the
    # published port exists for the from-source dev flow.
    #
    # The host side is overridable because 8002 collides in practice — it
    # blocked `docker compose up` against another project on the same
    # machine. The bind address stays loopback by default and MUST stay
    # loopback on any shared host, for the pillow reasons above. Override the
    # whole left side, e.g. PAPER_MCP_MARKER_PUBLISH=127.0.0.1:18002
    ports: ["${PAPER_MCP_MARKER_PUBLISH:-127.0.0.1:8002}:8002"]
    environment:
      # Marker's use_llm accuracy pass materially improves tables, math and
      # layout. It is an internal quality knob on a deterministic pipeline —
      # never exposed as a tool — and the service runs keyless without it
      # (SRS §I-7).
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Which model that accuracy pass calls. marker-pdf carries its own
      # default and Google has already retired it once — every call 404'd,
      # Marker logged a warning, returned 200, and the pass silently stopped
      # running. Empty falls back to the pinned default in llm_config.py.
      - MARKER_GEMINI_MODEL=${MARKER_GEMINI_MODEL:-}
      # Trust the PDF's own text layer instead of re-reading the page.
      # The default (1) is a hardware constraint: Surya's recognition pass on
      # a dense two-column page measured ~5.9 GB and crashes a 6 GB card.
      # It costs correct inline maths — the embedded layer encodes symbols
      # through Type1 font tables, so an integral arrives as "R" and epsilon
      # vanishes, while display equations stay perfect and hide the damage.
      # On a bigger card set 0 to buy correct maths with VRAM. Each bundle
      # records which mode produced it in `extraction.text_source`.
      - MARKER_DISABLE_OCR=${MARKER_DISABLE_OCR:-1}
    volumes:
      # ~2 GB of Surya weights download once and persist across image
      # rebuilds; without this every rebuild re-downloads them.
      - marker-models:/models
    # ── containment (SRS NFR-02) ─────────────────────────────────────────
    # Marker is the sandbox boundary, in the way nsjail was for LaTeX. It is
    # the only component that touches untrusted input: `marker-pdf` pins
    # `pillow<11` at every released version while current image-decode
    # advisories are fixed in 12.3.0, and upgrading is not available — so the
    # control is not whether an exploit triggers, but what it reaches.
    #
    # Pre-validation cannot substitute. The advisories are decode bugs
    # reachable through images that are otherwise perfectly legitimate, and
    # decoding documents is what this service is for.
    #
    # Egress is deliberately NOT cut here, and that is a trade-off rather than
    # an oversight. Cutting it (a `networks: [internal]` with
    # `internal: true`) is the strongest control available in compose — but it
    # also disables Marker's `use_llm` accuracy pass, which calls Google's
    # API and is what keeps table structure honest. Compose cannot allowlist a
    # single host; that needs a proxy or host firewall.
    #
    # So: keyless deployments SHOULD cut egress once the weights are cached
    # (they download on first extraction). Deployments using GEMINI_API_KEY
    # keep egress and rely on the controls below. Choose deliberately.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # Marker writes scratch files per extraction; a read-only root needs
      # somewhere for them, sized so a decompression bomb fills a tmpfs
      # rather than the host disk.
      #
      # `exec` is required, not incidental. torch 2.13 dispatches through
      # Triton, which JIT-compiles a CUDA module on first inference and then
      # dlopen()s what it just wrote; Docker mounts tmpfs `noexec` by default,
      # so without this the compile succeeds and the load fails with "failed
      # to map segment from shared object" — at the first extraction, after
      # /health has already reported ok.
      #
      # It does mean one writable+executable location inside the sandbox.
      # That is inherent to a JIT, and it is bounded: 2 GB, wiped on restart,
      # inside a container with no capabilities and a read-only root. Pinning
      # torch below 2.13 would remove the whole class — both this and the C
      # toolchain the JIT needs — at the cost of overriding the lockfile.
      # Scratch grows with the page batch, so raise it alongside
      # PAPER_MCP_MARKER_MAX_PAGES rather than on its own.
      - /tmp:size=${MARKER_TMPFS_SIZE:-2g},exec
    # Host RAM, not VRAM. Sized for the 1-page/OCR-off default; enabling
    # recognition and batching several pages needs more of both.
    mem_limit: ${MARKER_MEM_LIMIT:-8g}
    pids_limit: 512
    restart: unless-stopped
    # GPU passthrough. Requires the NVIDIA container toolkit on the host;
    # Marker falls back to CPU automatically if unavailable, which is far too
    # slow to be useful but does not crash.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${MARKER_GPU_COUNT:-1}
              capabilities: [gpu]

volumes:
  paper-mcp-artifacts:
  # Separate from the artifact cache because the contents are different in
  # kind: these are the caller's original uploads, held only until their job
  # runs, and never served over HTTP.
  paper-mcp-spool:
  marker-models:
